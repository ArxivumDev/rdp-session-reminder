name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RdpSessionReminder-Windows
          path: |
            dist/RdpSessionReminder-Windows.zip
            dist/SHA256SUMS.txt
