name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RdpSessionReminder-Windows
          path: |
            dist/RdpSessionReminder-Installer.exe
            dist/RdpSessionReminder-Uninstaller.exe
            dist/RdpSessionReminder-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  attest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate stable release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use stable semantic versioning (for example, v1.2.0)." >&2
            exit 1
          fi
          expected_heading="# RDP Session Reminder $GITHUB_REF_NAME"
          actual_heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$actual_heading" != "$expected_heading" ]]; then
            echo "RELEASE_NOTES.md does not match $GITHUB_REF_NAME." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "public const string Version = \"$version\";" \
              src/RdpSessionReminderInstaller.cs; then
            echo "Installer source version does not match $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RdpSessionReminder-Windows
          path: dist

      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/RdpSessionReminder-Installer.exe
            dist/RdpSessionReminder-Uninstaller.exe
            dist/RdpSessionReminder-Windows.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download attested Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RdpSessionReminder-Windows
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "RDP Session Reminder $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/RdpSessionReminder-Installer.exe \
            dist/RdpSessionReminder-Uninstaller.exe \
            dist/RdpSessionReminder-Windows.zip \
            dist/SHA256SUMS.txt
